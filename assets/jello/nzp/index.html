<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta content="Nazi Zombies: Portable" property="og:title">
    <meta content="Call of Duty: Zombies de-make, now in your browser via WebGL!" property="og:description">
    <meta content="https://nzp-team.github.io/latest/game.html" property="og:url">
    <meta content="https://nzp-team.github.io/latest/nzportable.ico" property="og:image">
    <meta content="#6e0d00" data-react-helmet="true" name="theme-color">

    <title>NZ: Portable</title>

    <link rel="icon" href="nzportable.ico">

    <style>

        html,
        body {
            background-color: #000000;
            color: #808080;

            height: 100%;
            width: 100%;

            margin: 0;
            padding: 0;
        }

        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }

        div.emscripten {
            text-align: center;
            padding: 0;
            margin: 0;
        }

        canvas.emscripten {
            border: 0px none;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            position: fixed;

            bottom: 20px;
            left: 20px;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;
            white-space: nowrap;

            z-index: 99999;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .back-button:hover {
            width: 115px;

            background: #ddd;

            transform: scale(1.08);

            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;

            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        .music-button {
            position: fixed;

            bottom: 20px;
            right: 20px;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;
            white-space: nowrap;

            z-index: 99999;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;
        }

        .music-button:hover {
            width: 145px;

            background: #ddd;

            transform: scale(1.08);

            border-radius: 35px;
        }

        .music-button .music-letter {
            display: block;
        }

        .music-button .music-text {
            display: none;

            font-size: 18px;
        }

        .music-button:hover .music-letter {
            display: none;
        }

        .music-button:hover .music-text {
            display: block;
        }

    </style>
</head>

<body
    ondrop="gotdrop(event);"
    ondragover="event.preventDefault()"
>

    <!-- =========================
         NZP
    ========================= -->

    <div class="emscripten" id="status">
        Please allow/unblock our javascript to play.
    </div>

    <div
        id="dropzone"
        ondrop="gotdrop(event);"
        ondragover="event.preventDefault()"
        hidden="1"
    >
        Drop Zone
    </div>

    <button
        type="button"
        onclick="begin()"
        id="begin"
        hidden="1"
    >
        Click To Begin!
    </button>

    <div class="emscripten">
        <progress
            value="0"
            max="100"
            id="progress"
            hidden="1"
        ></progress>
    </div>

    <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        hidden="1"
    ></canvas>


    <!-- =========================
         BACK BUTTON
    ========================= -->

    <button
        class="back-button"
        onclick="goBackToGames()"
    >
        <span class="back-letter">←</span>
        <span class="back-text">Back</span>
    </button>


    <!-- =========================
         MUSIC BUTTON
    ========================= -->

    <button
        class="music-button"
        onclick="openJelloMusic()"
    >
        <span class="music-letter">M</span>
        <span class="music-text">Jello Music</span>
    </button>


    <script type="text/javascript">

        /* =========================
           NZP ENGINE
        ========================= */

        var Module = {

            files:
            {
                "default.fmf": "default.fmf",
                "nzp/game.pk3": "nzp/game.pk3",
                "nzp/progs.pk3": "nzp/progs.pk3"
            },

            print: function(msg)
            {
                console.log(msg);
            },

            printErr: function(text)
            {
                console.log(text);
            },

            canvas:
                document.getElementById("canvas"),

            setStatus: function(text)
            {
                if (Module.setStatus.interval)
                    clearInterval(Module.setStatus.interval);

                var m =
                    text.match(
                        /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/
                    );

                var statusElement =
                    document.getElementById("status");

                var progressElement =
                    document.getElementById("progress");

                if (m)
                {
                    text = m[1];

                    progressElement.value =
                        parseInt(m[2]) * 100;

                    progressElement.max =
                        parseInt(m[4]) * 100;

                    progressElement.hidden = false;
                }
                else
                {
                    progressElement.value = null;
                    progressElement.max = null;

                    progressElement.hidden = true;
                }

                statusElement.innerHTML = text;

                statusElement.hidden =
                    text.length == 0;
            },

            totalDependencies: 0,

            monitorRunDependencies: function(left)
            {
                this.totalDependencies =
                    Math.max(
                        this.totalDependencies,
                        left
                    );

                Module.setStatus(
                    left
                        ? "Preparing... (" +
                          (
                              this.totalDependencies -
                              left
                          ) +
                          "/" +
                          this.totalDependencies +
                          ")"

                        : "All downloads complete."
                );
            },

            postRun:
            [
                function()
                {
                    if (
                        Module["sched"] === undefined
                    )
                    {
                        alert(
                            "Unable to initialise. You may need to restart your browser. " +
                            "If you get this often and inconsistently, consider using a 64bit browser instead."
                        );

                        Module.setStatus(
                            "Initialisation Failure"
                        );
                    }
                }
            ]
        };


        /* =========================
           START NZP
        ========================= */

        function begin()
        {
            if (Module.began)
                return;

            Module.began = true;

            document.getElementById(
                "dropzone"
            ).hidden = true;

            document.getElementById(
                "begin"
            ).hidden = true;

            Module.setStatus(
                "Downloading..."
            );

            var s =
                document.createElement("script");

            s.setAttribute(
                "src",
                "ftewebgl.js"
            );

            s.setAttribute(
                "type",
                "text/javascript"
            );

            s.setAttribute(
                "charset",
                "utf-8"
            );

            s.addEventListener(
                "error",
                function()
                {
                    alert(
                        "Oh noes! we got an error!"
                    );

                    Module.setStatus(
                        "Unable to download engine javascript"
                    );
                },
                false
            );

            document.head.appendChild(s);
        }


        /* =========================
           FILE PATH HANDLING
        ========================= */

        function fixupfilepath(fname, path)
        {
            if (path != "")
                return path + fname;

            var ext =
                fname.substr(
                    fname.lastIndexOf(".") + 1
                );

            if (
                ext == "fmf" ||
                ext == "kpf"
            )
            {
                return fname;
            }

            if (
                ext == "bsp" ||
                ext == "map" ||
                ext == "lit" ||
                ext == "lux"
            )
            {
                return "id1/maps/" + fname;
            }

            return "id1/" + fname;
        }


        function showfiles()
        {
            if (Module.began)
                return;

            Module.setStatus("");

            document.getElementById(
                "dropzone"
            ).hidden = false;

            document.getElementById(
                "begin"
            ).hidden = false;

            var nt =
                "Drag gamedirs or individual package files here " +
                "to make them available!<br/>" +
                "Active Files:<br/><pre>";

            var keys =
                Object.keys(Module.files);

            for (
                var i = 0;
                i < keys.length;
                i++
            )
            {
                if (
                    Module.files[keys[i]]
                    instanceof ArrayBuffer
                )
                {
                    var sz =
                        Module.files[keys[i]]
                        .byteLength;

                    if (sz > 512 * 1024)
                    {
                        sz =
                            (sz / (1024 * 1024)) +
                            "mb";
                    }
                    else if (sz > 512)
                    {
                        sz =
                            (sz / 1024) +
                            "kb";
                    }
                    else
                    {
                        sz =
                            sz +
                            " bytes";
                    }

                    nt +=
                        "    " +
                        keys[i] +
                        " (" +
                        sz +
                        ")<br/>";
                }
                else
                {
                    nt +=
                        "    " +
                        keys[i] +
                        "<br/>";
                }
            }

            nt +=
                "</pre>(" +
                keys.length +
                " files)";

            document.getElementById(
                "dropzone"
            ).innerHTML = nt;
        }


        function scanfiles(item, path)
        {
            if (item.isFile)
            {
                item.file(function(f)
                {
                    let n =
                        fixupfilepath(
                            f.name,
                            path
                        );

                    Module.files[n] =
                        f.arrayBuffer();

                    Module.files[n].then(
                        buf =>
                        {
                            Module.files[n] = buf;

                            showfiles();
                        }
                    );
                });
            }
            else if (item.isDirectory)
            {
                var dirReader =
                    item.createReader();

                dirReader.readEntries(
                    function(entries)
                    {
                        for (
                            var i = 0;
                            i < entries.length;
                            i++
                        )
                        {
                            scanfiles(
                                entries[i],
                                path +
                                item.name +
                                "/"
                            );
                        }
                    }
                );
            }
        }


        function gotdrop(ev)
        {
            ev.preventDefault();

            for (
                var i = 0;
                i < ev.dataTransfer.items.length;
                i++
            )
            {
                if (
                    ev.dataTransfer.items[i]
                    .webkitGetAsEntry
                )
                {
                    var d =
                        ev.dataTransfer.items[i]
                        .webkitGetAsEntry();

                    if (d)
                    {
                        scanfiles(
                            d,
                            ""
                        );
                    }
                }
                else if (
                    ev.dataTransfer.items[i].kind ===
                    "file"
                )
                {
                    var f =
                        ev.dataTransfer.items[i]
                        .getAsFile();

                    var n =
                        fixupfilepath(
                            f.name
                        );

                    Module.files[n] =
                        f.arrayBuffer();

                    Module.files[n].then(
                        buf =>
                        {
                            Module.files[n] = buf;

                            showfiles();
                        }
                    );
                }
            }

            showfiles();
        }


        /* =========================
           BACK TO GAMES
        ========================= */

        function goBackToGames()
        {
            window.location.href =
                "../../../games.html";
        }


        /* =========================
           JELLO MUSIC
        ========================= */

        var musicWindow = null;


        function openJelloMusic()
        {
            /*
             * NZP location:
             *
             * assets/jello/nzp/index.html
             *
             * Site root:
             *
             * ../../../
             */

            var musicURL =
                new URL(
                    "../../../music.html",
                    window.location.href
                ).href;


            /*
             * If the music window is already open,
             * reuse it.
             */

            if (
                musicWindow &&
                !musicWindow.closed
            )
            {
                musicWindow.focus();
                return;
            }


            /*
             * Open a REAL about:blank window.
             */

            musicWindow =
                window.open(
                    "about:blank",
                    "jelloMusicPlayer",
                    "popup=yes,width=1000,height=750"
                );


            if (!musicWindow)
            {
                alert(
                    "Please allow pop-ups for Jello Music."
                );

                return;
            }


            /*
             * Put music.html inside the
             * about:blank window using an iframe.
             */

            musicWindow.document.open();

            musicWindow.document.write(
                '<!doctype html>' +
                '<html>' +

                '<head>' +

                '<meta charset="UTF-8">' +

                '<style>' +

                'html, body {' +
                    'margin: 0;' +
                    'padding: 0;' +
                    'width: 100%;' +
                    'height: 100%;' +
                    'overflow: hidden;' +
                    'background: #000;' +
                '}' +

                'iframe {' +
                    'display: block;' +
                    'width: 100%;' +
                    'height: 100%;' +
                    'border: 0;' +
                '}' +

                '</style>' +

                '</head>' +

                '<body>' +

                '<iframe ' +
                    'src="' +
                    musicURL.replace(/"/g, '&quot;') +
                    '" ' +
                    'allow="autoplay; fullscreen" ' +
                    'title="Jello Music">' +
                '</iframe>' +

                '</body>' +

                '</html>'
            );

            musicWindow.document.close();

            /*
             * Keep the top-level document title empty.
             */

            musicWindow.document.title = "";

            musicWindow.focus();
        }


        /* =========================
           STARTUP
        ========================= */

        if (
            window.location.hash != "" ||
            Object.keys(Module.files).length
        )
        {
            begin();
        }
        else
        {
            showfiles();
        }

    </script>

</body>
</html>
