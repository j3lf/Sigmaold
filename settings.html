<!DOCTYPE html>
<html>
<head>
    <title>Settings - Sigma Jello</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Moving Background */

        .background {
            position: fixed;
            inset: -40px;

            background: url("assets/backround.jpg")
                center center / cover no-repeat;

            z-index: 0;

            transform: translate(0px, 0px);

            transition: transform 0.15s ease-out;

            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 35px;
        }

        .setting {
            background: white;
            color: black;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px 20px;
            margin: 10px auto;
            width: 300px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .setting-name {
            font-size: 18px;
            font-weight: bold;
        }

        /* Sign Out Button */

        .sign-out-button {
            width: 340px;

            padding: 15px 20px;
            margin: 10px auto;

            background: white;
            color: #c00000;

            border: 1px solid #ddd;
            border-radius: 6px;

            font-size: 18px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease,
                color 0.15s ease;
        }

        .sign-out-button:hover {
            background: #e7e7e7;
            color: #a00000;
            transform: translateX(3px);
        }

        /* Toggle switch */

        .switch {
            position: relative;
            width: 48px;
            height: 25px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #cfcfcf;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 19px;
            height: 19px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #111;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* Back Button */

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;

            width: 65px;
            height: 65px;

            padding: 0;
            margin: 0;

            border-radius: 50%;
            border: none;

            background: white;
            color: black;

            font-size: 28px;
            font-weight: bold;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            transition:
                width 0.25s ease,
                transform 0.2s ease,
                background 0.2s ease,
                border-radius 0.25s ease;

            z-index: 10;
        }

        .back-button:hover {
            width: 115px;
            background: #ddd;
            transform: scale(1.08);
            border-radius: 35px;
        }

        .back-button .back-letter {
            display: block;
        }

        .back-button .back-text {
            display: none;
            font-size: 18px;
        }

        .back-button:hover .back-letter {
            display: none;
        }

        .back-button:hover .back-text {
            display: block;
        }

        /* Quick Settings */

        .quick-settings {
            display: none;
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .quick-settings.show {
            display: flex;
        }

        .quick-settings-box {
            width: 360px;

            background: white;
            color: black;

            border-radius: 6px;
            padding: 25px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.65);

            animation: clickguiOpen 0.2s ease-out;
        }

        .quick-settings-box h2 {
            margin: 0 0 22px 0;

            font-size: 25px;
            font-weight: bold;

            color: black;
        }

        .quick-setting {
            background: #f2f2f2;

            border: 1px solid #ddd;
            border-radius: 5px;

            padding: 15px;
            margin-bottom: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: black;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .quick-setting:hover {
            background: #e7e7e7;
            transform: translateX(3px);
        }

        .quick-setting span {
            font-size: 16px;
            font-weight: bold;
        }

        .hint {
            margin: 18px 0 0 0;

            color: #777;

            font-size: 13px;
            text-align: center;
        }

        @keyframes clickguiOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Background -->

    <div id="background" class="background"></div>


    <div class="container">

        <h1>Settings</h1>

        <!-- Auto Cloak -->

        <div class="setting">

            <span class="setting-name">
                Auto Cloak
            </span>

            <label class="switch">

                <input
                    type="checkbox"
                    id="autoCloak">

                <span class="slider"></span>

            </label>

        </div>


        <!-- No Tab Close -->

        <div class="setting">

            <span class="setting-name">
                No Tab Close
            </span>

            <label class="switch">

                <input
                    type="checkbox"
                    id="noTabClose">

                <span class="slider"></span>

            </label>

        </div>


        <!-- Mouse Background Movement -->

        <div class="setting">

            <span class="setting-name">
                Mouse Background Movement
            </span>

            <label class="switch">

                <input
                    type="checkbox"
                    id="mouseBackground">

                <span class="slider"></span>

            </label>

        </div>


        <!-- Sign Out -->

        <button
            class="sign-out-button"
            onclick="signOut()"
        >
            Sign Out
        </button>

    </div>


    <!-- Back Button -->

    <button
        class="back-button"
        onclick="location.href='index.html'">

        <span class="back-letter">
            ←
        </span>

        <span class="back-text">
            Back
        </span>

    </button>


    <!-- Quick Settings -->

    <div
        id="quickSettings"
        class="quick-settings">

        <div class="quick-settings-box">

            <h2>Settings</h2>


            <!-- No Tab Close -->

            <div class="quick-setting">

                <span>
                    No Tab Close
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickNoTabClose">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Full Screen -->

            <div class="quick-setting">

                <span>
                    Full Screen
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickFullscreen">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Mouse Background Movement -->

            <div class="quick-setting">

                <span>
                    Mouse Background Movement
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="quickMouseBackground">

                    <span class="slider"></span>

                </label>

            </div>


            <p class="hint">
                Press P to close
            </p>

        </div>

    </div>


    <script>

        /* =========================
           ELEMENTS
           ========================= */

        const background =
            document.getElementById("background");

        const autoCloak =
            document.getElementById("autoCloak");

        const noTabClose =
            document.getElementById("noTabClose");

        const mouseBackground =
            document.getElementById("mouseBackground");

        const quickSettings =
            document.getElementById("quickSettings");

        const quickNoTabClose =
            document.getElementById("quickNoTabClose");

        const quickFullscreen =
            document.getElementById("quickFullscreen");

        const quickMouseBackground =
            document.getElementById("quickMouseBackground");


        /* =========================
           SIGN OUT
           ========================= */

        function signOut() {

            localStorage.removeItem(
                "sigmaJelloUsername"
            );

            localStorage.removeItem(
                "sigmaJelloLoggedIn"
            );

            window.location.href =
                "index.html";

        }


        /* =========================
           AUTO CLOAK
           ========================= */

        autoCloak.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    const siteURL =
                        new URL(
                            "index.html",
                            window.location.href
                        ).href;


                    const cloakWindow =
                        window.open(
                            "about:blank",
                            "_blank"
                        );


                    if (!cloakWindow) {

                        alert(
                            "Your browser blocked the popup. Allow popups for this site."
                        );

                        this.checked = false;

                        return;
                    }


                    cloakWindow.document.open();

                    cloakWindow.document.write(`

                        <!DOCTYPE html>

                        <html>

                        <head>

                            <title>
                                Sigma Jello
                            </title>

                            <style>

                                html,
                                body {

                                    margin: 0;
                                    padding: 0;

                                    width: 100%;
                                    height: 100%;

                                    overflow: hidden;

                                    background: black;

                                }


                                iframe {

                                    width: 100%;
                                    height: 100%;

                                    border: none;

                                }

                            </style>

                        </head>


                        <body>

                            <iframe
                                src="${siteURL}"
                                allowfullscreen>
                            </iframe>

                        </body>

                        </html>

                    `);

                    cloakWindow.document.close();

                }

            }
        );


        /* =========================
           NO TAB CLOSE
           ========================= */

        function enableNoTabClose() {

            window.onbeforeunload =
                function(event) {

                    event.preventDefault();

                    event.returnValue = "";

                    return "";

                };

        }


        function disableNoTabClose() {

            window.onbeforeunload = null;

        }


        /* Load saved setting */

        if (
            localStorage.getItem("noTabClose")
            === "true"
        ) {

            noTabClose.checked = true;

            quickNoTabClose.checked = true;

            enableNoTabClose();

        }


        /* Main settings toggle */

        noTabClose.addEventListener(
            "change",
            function() {

                quickNoTabClose.checked =
                    this.checked;


                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* Quick settings toggle */

        quickNoTabClose.addEventListener(
            "change",
            function() {

                noTabClose.checked =
                    this.checked;


                if (this.checked) {

                    localStorage.setItem(
                        "noTabClose",
                        "true"
                    );

                    enableNoTabClose();

                } else {

                    localStorage.setItem(
                        "noTabClose",
                        "false"
                    );

                    disableNoTabClose();

                }

            }
        );


        /* =========================
           MOUSE BACKGROUND MOVEMENT
           ========================= */

        let mouseBackgroundEnabled =
            localStorage.getItem("mouseBackground")
            !== "false";


        mouseBackground.checked =
            mouseBackgroundEnabled;


        quickMouseBackground.checked =
            mouseBackgroundEnabled;


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!mouseBackgroundEnabled)
                    return;


                const x =
                    (event.clientX / window.innerWidth)
                    - 0.5;


                const y =
                    (event.clientY / window.innerHeight)
                    - 0.5;


                const moveX =
                    x * 35;


                const moveY =
                    y * 35;


                background.style.transform =
                    `translate(${moveX}px, ${moveY}px)`;

            }
        );


        /* Main settings toggle */

        mouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;


                quickMouseBackground.checked =
                    this.checked;


                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );


                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* Quick settings toggle */

        quickMouseBackground.addEventListener(
            "change",
            function() {

                mouseBackgroundEnabled =
                    this.checked;


                mouseBackground.checked =
                    this.checked;


                localStorage.setItem(
                    "mouseBackground",
                    mouseBackgroundEnabled
                );


                if (!mouseBackgroundEnabled) {

                    background.style.transform =
                        "translate(0px, 0px)";

                }

            }
        );


        /* =========================
           FULL SCREEN
           ========================= */

        quickFullscreen.addEventListener(
            "change",
            function() {

                if (this.checked) {

                    if (
                        document.documentElement
                            .requestFullscreen
                    ) {

                        document.documentElement
                            .requestFullscreen();

                    }

                } else {

                    if (
                        document.fullscreenElement
                    ) {

                        document.exitFullscreen();

                    }

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                quickFullscreen.checked =
                    !!document.fullscreenElement;

            }
        );


        /* =========================
           P KEY CLICKGUI
           ========================= */

        window.addEventListener(
            "keydown",
            function(event) {

                if (event.code === "KeyP") {

                    if (event.repeat)
                        return;

                    event.preventDefault();

                    quickSettings.classList.toggle(
                        "show"
                    );

                }

            }
        );


        /* Close by clicking outside */

        quickSettings.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    quickSettings
                ) {

                    quickSettings.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
